name: Verify Mocceutics demo
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: mocceutics-public-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: node scripts/scan-math-test.mjs
      - run: node scripts/ai-contract-test.mjs
      - run: node scripts/articles-test.mjs
      - run: node scripts/alignment-test.mjs
      - run: node scripts/hair-region-test.mjs
      - run: node scripts/wash-test.mjs
      - run: node scripts/cloud-client-test.mjs
      - name: Test database access policies in PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/moc-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.13
          MOC_PGLITE_PATH="$RUNNER_TEMP/moc-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/database-policy-test.mjs
          MOC_PGLITE_PATH="$RUNNER_TEMP/moc-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/product-codes-policy-test.mjs
      - name: Verify public app and assets
        run: |
          node --input-type=module <<'JS'
          const base = new URL('https://tiengiaphuoc.github.io/tgp/');
          const {readFile} = await import('node:fs/promises');
          const expectedPosts = JSON.parse(await readFile('content/posts.json', 'utf8'));
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              for (const [path, expected] of [['./', 'Mộcceutics — Chăm tóc'], ['./src/app.js', 'function render()'], ['./src/hair-scan.js', 'measurePixels'], ['./src/scan-alignment.js', 'alignmentchange'], ['./src/hair-region.js', 'mountHairRegion'], ['./src/alignment.css', '.alignment-stage'], ['./src/ai-client.js', 'requestAiAssessment'], ['./src/ai-ui.js', 'aiOverview'], ['./src/theme.css', 'botanical studio'], ['./src/vintage.css', 'sunny botanical'], ['./src/brand.css', 'brand-logo'], ['./src/welcome.css', 'welcome-card'], ['./src/wash-schedule.js', 'nextWash'], ['./src/wash.css', '.wash-card'], ['./src/product-access.js', 'createProductAccess'], ['./supabase/product-codes.sql', 'redeem_product_code'], ['./src/cloud-client.js', 'createCloudClient'], ['./src/live-admin.js', 'startLiveAdmin'], ['./src/cloud-sync.js', 'createProfileSync'], ['./database-setup.html', 'setup-config'], ['./supabase/setup.sql', 'profile_read'], ['./assets/moc-vintage-garden.svg', 'BOTANICAL'], ['./src/article-store.js', 'buildPublication'], ['./src/article-manager.js', 'createArticleManager'], ['./content/posts.json', 'schemaVersion'], ['./src/articles.css', '.cms-editor'], ['./src/style.css', '.sidebar'], ['./admin.html', 'Quản trị chăm sóc'], ['./src/admin.js', 'function shell()'], ['./src/admin.css', '.drawer']]) {
                const response = await fetch(new URL(path, base));
                if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
                if (!response.url.startsWith(base.href)) throw new Error('Unexpected redirect: ' + response.url);
                if (!(await response.text()).includes(expected)) throw new Error(`${path}: expected content missing`);
              }
              const published = await fetch(new URL('./content/posts.json', base), {cache: 'no-cache'});
              if (!published.ok || JSON.stringify(await published.json()) !== JSON.stringify(expectedPosts)) throw new Error('Public article file has not updated to this version yet');
              console.log('VERIFIED_ARTICLES=' + expectedPosts.posts.map(post => post.title).join(' | '));
              console.log('VERIFIED_APP_URL=' + base.href);
              break;
            } catch (error) {
              if (attempt === 11) throw error;
              console.log('Waiting for deployment: ' + error.message);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          JS
      - name: Install browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/moc-browser" --no-save --ignore-scripts playwright
          if ! command -v google-chrome; then
            node "$RUNNER_TEMP/moc-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Test the public app on mobile and desktop
        env:
          MOC_APP_URL: https://tiengiaphuoc.github.io/tgp/
        run: |
          export MOC_PLAYWRIGHT_PATH="$RUNNER_TEMP/moc-browser/node_modules/playwright"
          export MOC_CHROME_PATH="$(command -v google-chrome || true)"
          node scripts/browser-suite.cjs
