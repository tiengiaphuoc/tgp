name: Verify Mocceutics demo
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: mocceutics-public-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: node scripts/scan-math-test.mjs
      - run: node scripts/ai-contract-test.mjs
      - name: Verify public app and assets
        run: |
          node --input-type=module <<'JS'
          const base = new URL('https://tiengiaphuoc.github.io/tgp/');
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              for (const [path, expected] of [['./', 'Mộcceutics — Chăm tóc'], ['./src/app.js', 'function render()'], ['./src/hair-scan.js', 'measurePixels'], ['./src/ai-client.js', 'requestAiAssessment'], ['./src/ai-ui.js', 'aiOverview'], ['./src/theme.css', 'botanical studio'], ['./src/style.css', '.sidebar'], ['./admin.html', 'Quản trị chăm sóc'], ['./src/admin.js', 'function shell()'], ['./src/admin.css', '.drawer']]) {
                const response = await fetch(new URL(path, base));
                if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
                if (!response.url.startsWith(base.href)) throw new Error('Unexpected redirect: ' + response.url);
                if (!(await response.text()).includes(expected)) throw new Error(`${path}: expected content missing`);
              }
              console.log('VERIFIED_APP_URL=' + base.href);
              break;
            } catch (error) {
              if (attempt === 11) throw error;
              console.log('Waiting for deployment: ' + error.message);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          JS
      - name: Install browser test tool
        run: |
          npm install --prefix "$RUNNER_TEMP/moc-browser" --no-save --ignore-scripts playwright
          if ! command -v google-chrome; then
            node "$RUNNER_TEMP/moc-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Test the public app on mobile and desktop
        env:
          MOC_APP_URL: https://tiengiaphuoc.github.io/tgp/
        run: |
          export MOC_PLAYWRIGHT_PATH="$RUNNER_TEMP/moc-browser/node_modules/playwright"
          export MOC_CHROME_PATH="$(command -v google-chrome || true)"
          node scripts/public-smoke.cjs
          node scripts/admin-smoke.cjs
          node scripts/scan-smoke.cjs
          node scripts/design-smoke.cjs
